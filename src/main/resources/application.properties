spring.application.name=plataforma-ph

# Base de datos SQLite
spring.datasource.url=jdbc:sqlite:${DB_PATH:./propiedad_horizontal.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Plantillas
spring.thymeleaf.check-template-location=false

# Muestra el texto de los errores de la API (por ejemplo, el motivo de un 409)
spring.web.error.include-message=always

# Seguridad: intentos fallidos antes de bloquear la cuenta
app.seguridad.max-intentos=5

# Administrador inicial (solo se usa cuando no existe ningún usuario).
# Si ADMIN_PASSWORD no está definida, se genera una contraseña aleatoria y se muestra una vez en el log.
app.admin.correo=${ADMIN_CORREO:admin@ph.local}
app.admin.password=${ADMIN_PASSWORD:}

# Reportes: imágenes de evidencia (se guardan como archivos, no en la base)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.uploads.dir=${UPLOADS_DIR:./uploads}