<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
    .card { max-width: 380px; margin: 12vh auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 1.3rem; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-size: .9rem; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd2d9; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font-size: 1rem; cursor: pointer; }
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: .9rem; }
    .ok { background: #e3f6e8; color: #166534; }
    p.volver { margin: 16px 0 0; text-align: center; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Recuperar contraseña</h1>
    <div class="msg ok" th:if="${enviado}">
      Si el correo está registrado, recibirás un enlace para restablecer tu contraseña.
      El enlace vence en 30 minutos.
    </div>
    <form th:action="@{/recuperar}" method="post" th:unless="${enviado}">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" required autofocus>
      <button type="submit">Enviar enlace</button>
    </form>
    <p class="volver"><a th:href="@{/login}">Volver a iniciar sesión</a></p>
  </main>
</body>
</html>S
