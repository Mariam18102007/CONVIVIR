<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabecera('Inicio')}"></head>
<body th:attr="data-rol=${rol}">
<div class="app">
  <aside th:replace="~{fragments :: menu}"></aside>

  <main class="contenido">
    <section class="hero">
      <div class="hero-texto">
        <h1><span id="saludo">¡Hola!</span><br>Todo lo que necesitas hoy, en un solo lugar</h1>
        <p id="fechaHoy"></p>
      </div>
      <svg class="hero-ilus" viewBox="0 0 380 200" aria-hidden="true">
        <ellipse cx="190" cy="186" rx="185" ry="12" fill="#DDEEDF"/>
        <rect x="205" y="30" width="70" height="120" rx="6" fill="#fff" stroke="#CFE3D2" stroke-width="2"/>
        <rect x="285" y="50" width="60" height="100" rx="6" fill="#fff" stroke="#CFE3D2" stroke-width="2"/>
        <rect x="120" y="55" width="70" height="95" rx="6" fill="#fff" stroke="#CFE3D2" stroke-width="2"/>
        <g fill="#BFE3D0">
          <rect x="215" y="42" width="12" height="14" rx="2"/><rect x="235" y="42" width="12" height="14" rx="2"/><rect x="255" y="42" width="12" height="14" rx="2"/>
          <rect x="215" y="68" width="12" height="14" rx="2"/><rect x="235" y="68" width="12" height="14" rx="2"/><rect x="255" y="68" width="12" height="14" rx="2"/>
          <rect x="215" y="94" width="12" height="14" rx="2"/><rect x="235" y="94" width="12" height="14" rx="2"/><rect x="255" y="94" width="12" height="14" rx="2"/>
          <rect x="295" y="62" width="12" height="14" rx="2"/><rect x="315" y="62" width="12" height="14" rx="2"/>
          <rect x="295" y="88" width="12" height="14" rx="2"/><rect x="315" y="88" width="12" height="14" rx="2"/>
          <rect x="130" y="68" width="12" height="14" rx="2"/><rect x="150" y="68" width="12" height="14" rx="2"/><rect x="168" y="68" width="12" height="14" rx="2"/>
          <rect x="130" y="94" width="12" height="14" rx="2"/><rect x="150" y="94" width="12" height="14" rx="2"/><rect x="168" y="94" width="12" height="14" rx="2"/>
        </g>
        <rect x="14" y="156" width="150" height="26" rx="8" fill="#CBE8F6" opacity=".8"/>
        <rect x="52" y="120" width="5" height="40" rx="2" fill="#D8C3A5"/><circle cx="54" cy="104" r="26" fill="#95D5B2"/>
        <rect x="334" y="120" width="5" height="40" rx="2" fill="#D8C3A5"/><circle cx="336" cy="106" r="22" fill="#74C69D"/>
        <circle cx="100" cy="112" r="14" fill="#F9C9B6"/>
        <circle cx="150" cy="140" r="9" fill="#F9C9B6"/><rect x="138" y="150" width="24" height="34" rx="12" fill="#F4B6A0"/>
        <circle cx="190" cy="136" r="10" fill="#C9966B"/><rect x="176" y="147" width="28" height="38" rx="14" fill="#95D5B2"/>
        <circle cx="228" cy="140" r="9" fill="#FDE7A9"/><rect x="216" y="150" width="24" height="34" rx="12" fill="#FDE7A9"/>
        <circle cx="262" cy="148" r="7" fill="#F9C9B6"/><rect x="254" y="156" width="16" height="28" rx="8" fill="#A9D6F5"/>
        <path d="M0 6c-4-3-6-5-6-8a3.5 3.5 0 0 1 6-2 3.5 3.5 0 0 1 6 2c0 3-2 5-6 8z" fill="#F4B6A0" transform="translate(190 118)"/>
      </svg>
    </section>

    <section class="kpis" id="kpis" aria-label="Resumen del día"></section>

    <section class="panel">
      <h2>Recordatorios rápidos</h2>
      <ul class="recordatorios" id="recordatorios">
        <li class="vacio-suave">Cargando tu resumen…</li>
      </ul>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const rol = (document.body.dataset.rol || '').toLowerCase();
const COP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
const hoy = new Date();
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
$('fechaHoy').textContent = hoy.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });

// Saludo según la hora del día
const hora = hoy.getHours();
$('saludo').textContent = hora < 12 ? '¡Buenos días!' : hora < 19 ? '¡Buenas tardes!' : '¡Buenas noches!';

const get = async url => { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch (e) { return null; } };
const n = x => (x == null ? '—' : x);

const VISTAS = {
  admin: [
    { t: 'Pagos al día', i: 'card', h: '/pagos', f: async () => {
        const p = await get('/api/pagos?desde=' + iso(new Date(hoy.getFullYear(), hoy.getMonth(), 1)) + '&estado=CONFIRMADO');
        return { v: p ? p.length : null, r: p && 'Pagos confirmados este mes: ' + p.length }; } },
    { t: 'Reservas de hoy', i: 'calendar', h: '/reservas', f: async () => {
        const l = await get('/api/reservas');
        const hoyL = l ? l.filter(r => String(r.inicio).startsWith(iso(hoy)) && ['SOLICITADA', 'CONFIRMADA'].includes(r.estado)) : null;
        const sol = l ? l.filter(r => r.estado === 'SOLICITADA').length : 0;
        return { v: hoyL ? hoyL.length : null, r: sol ? sol + ' reserva(s) esperan tu confirmación' : 'Reservas de hoy: ' + (hoyL ? hoyL.length : 0) }; } },
    { t: 'Accesos recientes', i: 'door', h: '/historial-accesos', f: async () => {
        const a = await get('/api/accesos/historial?desde=' + iso(hoy) + '&hasta=' + iso(hoy));
        return { v: a ? a.length : null, r: a && 'Ingresos registrados hoy: ' + a.length }; } },
    { t: 'Actividades pendientes', i: 'clipboard', h: '/reportes', f: async () => {
        const [rp, rs] = await Promise.all([get('/api/reportes?estado=ABIERTO'), get('/api/reservas?estado=SOLICITADA')]);
        const t = rp && rs ? rp.length + rs.length : null;
        return { v: t, r: rp && rp.length ? rp.length + ' reporte(s) abiertos por atender' : 'Sin reportes abiertos' }; } }
  ],
  consejo: [
    { t: 'Inmuebles con saldo', i: 'wallet', h: '/cartera', f: async () => { const c = await get('/api/cartera'); return { v: c ? c.length : null, r: c && c.length + ' inmueble(s) con saldo pendiente' }; } },
    { t: 'Recaudo del mes', i: 'chart', h: '/recaudo', f: async () => { const r = await get('/api/recaudo'); return { v: r ? COP.format(r.total) : null, r: r && r.pagos + ' pago(s) confirmados este mes' }; } },
    { t: 'Gastos registrados', i: 'coin', h: '/gastos', f: async () => { const g = await get('/api/gastos'); return { v: g ? g.filter(x => !x.anulado).length : null, r: 'Revisa los gastos del periodo' }; } }
  ],
  vigilante: [
    { t: 'Personas dentro', i: 'door', h: '/porteria', f: async () => { const d = await get('/api/porteria/dentro'); return { v: d ? d.length : null, r: d && d.length + ' persona(s) dentro del conjunto' }; } },
    { t: 'Vehículos dentro', i: 'car', h: '/control-vehicular', f: async () => { const d = await get('/api/porteria/vehiculos/dentro'); return { v: d ? d.length : null, r: d && d.length + ' vehículo(s) dentro' }; } },
    { t: 'Parq. de visitantes libres', i: 'parking', h: '/control-vehicular', f: async () => { const d = await get('/api/porteria/parqueaderos-visitantes'); return { v: d ? d.disponibles : null, r: d && d.disponibles + ' de ' + d.total + ' libres' }; } }
  ],
  residente: [
    { t: 'Saldo pendiente', i: 'wallet', h: '/mis-obligaciones', f: async () => { const r = await get('/api/obligaciones/mias/resumen'); const s = r ? r.reduce((a, x) => a + x.saldoPendiente, 0) : null; const v = r ? r.reduce((a, x) => a + x.saldoVencido, 0) : 0; return { v: s == null ? null : COP.format(s), r: v > 0 ? 'Tienes ' + COP.format(v) + ' vencidos' : 'Sin saldos vencidos' }; } },
    { t: 'Mis reservas activas', i: 'calendar', h: '/zonas-comunes', f: async () => { const l = await get('/api/reservas/mias'); const a = l ? l.filter(r => ['SOLICITADA', 'CONFIRMADA'].includes(r.estado)) : null; return { v: a ? a.length : null, r: a && 'Reservas activas: ' + a.length }; } },
    { t: 'Avisos sin leer', i: 'bell', h: '/mis-notificaciones', f: async () => { const l = await get('/api/notificaciones/mias'); const a = l ? l.filter(x => !x.leida).length : null; return { v: a, r: a ? a + ' aviso(s) nuevos' : 'Todo al día con tus avisos' }; } }
  ]
};

const clave = rol.startsWith('admin') ? 'admin' : rol.startsWith('miembro') ? 'consejo' : rol.startsWith('vigil') ? 'vigilante' : 'residente';

(async () => {
  const vistas = VISTAS[clave];
  const datos = await Promise.all(vistas.map(v => v.f()));
  $('kpis').innerHTML = vistas.map((v, k) => `
    <a class="kpi" href="${v.h}">
      <svg class="ic grande"><use href="#i-${v.i}"/></svg>
      <span class="kpi-t">${v.t}</span>
      <span class="kpi-fila"><strong>${n(datos[k].v)}</strong><svg class="ic"><use href="#i-arrow"/></svg></span>
    </a>`).join('');
  const items = datos.map(d => d.r).filter(Boolean);
  $('recordatorios').innerHTML = items.length
    ? items.map(t => `<li><span class="check"></span><span>${t}</span></li>`).join('')
    : '<li class="vacio-suave">No hay recordatorios por ahora. ¡Buen día!</li>';
})();
</script>
</body>
</html>
