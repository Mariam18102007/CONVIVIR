<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabecera('Nueva contraseña')}"></head>
<body class="lp">

<header class="lp-nav">
  <div class="lp-nav-in">
    <a th:href="@{/login}" class="logo" aria-label="Convivir"><span th:replace="~{fragments :: logo}"></span></a>
    <nav class="lp-links">
      <a class="btn btn-link" th:href="@{/login}">Iniciar sesión</a>
    </nav>
  </div>
</header>

<main>
  <section class="lp-seccion">
    <div class="lp-acceso">
      <div class="lp-login">
        <h2>Crea tu nueva contraseña</h2>

        <div th:if="${invalido}">
          <div class="lp-msg err">El enlace no es válido, ya se usó o venció.</div>
          <a class="olvido" th:href="@{/recuperar}">Solicitar un enlace nuevo</a>
        </div>

        <form th:unless="${invalido}" th:action="@{/restablecer}" method="post">
          <div class="lp-msg err" th:if="${error}" th:text="${error}">Error</div>
          <input type="hidden" name="token" th:value="${token}">
          <label for="password">Nueva contraseña (mínimo 8 caracteres)</label>
          <input id="password" name="password" type="password" minlength="8" required autofocus autocomplete="new-password">
          <label for="confirmar">Repite la contraseña</label>
          <input id="confirmar" name="confirmar" type="password" minlength="8" required autocomplete="new-password">
          <button type="submit">Guardar contraseña</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="lp-pie">Convivir · Proyecto de Ingeniería de Software II · Universidad Simón Bolívar</footer>
</body>
</html>
