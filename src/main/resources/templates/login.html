<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; }
    .card { max-width: 380px; margin: 12vh auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 1.3rem; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-size: .9rem; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd2d9; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font-size: 1rem; cursor: pointer; }
    .msg { padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: .9rem; }
    .err { background: #fde8e8; color: #9b1c1c; }
    .ok { background: #e3f6e8; color: #166534; }
    p.olvido { margin: 16px 0 0; text-align: center; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Iniciar sesión</h1>
    <div class="msg err" th:if="${param.error}">Credenciales inválidas, cuenta inactiva o bloqueada.</div>
    <div class="msg ok" th:if="${param.logout}">Sesión cerrada.</div>
    <div class="msg ok" th:if="${param.restablecido}">Contraseña actualizada. Ya puedes iniciar sesión.</div>
    <form th:action="@{/login}" method="post">
      <label for="correo">Correo electrónico</label>
      <input id="correo" name="correo" type="email" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="olvido"><a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a></p>
  </main>
</body>
</html>
